<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 323" width="432" height="323">
  <foreignObject x="0" y="0" width="432" height="323">
    <div xmlns="http://www.w3.org/1999/xhtml" style="direction:rtl;text-align:justify;font-family:Vazirmatn,sans-serif;font-size:17px;line-height:1.9;color:#B3A58F;margin:0;padding:0;">
      اسلام، مختلف مذاہب اور فکری <br/>مکاتب سے متعلق کـتابوں کے <br/>تعارف کے لیے ایک جامع اور معتبر <br/>علمی پلیٹ فارم، جس کا مقصد <br/>تحقیق کو آسان بنانا ہے۔
    </div>
  </foreignObject>
</svg>
